<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111d" />
    <title>YJH's Iceland Volcano Simulator</title>
    <style>
      html,body,#root{min-height:100%;margin:0}
      body{background:#07111d;color:#e8f0f7;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      #startup-status{box-sizing:border-box;min-height:100vh;display:grid;place-content:center;padding:32px;text-align:center}
      #startup-status h1{font-size:clamp(22px,4vw,34px);margin:0 0 12px}
      #startup-status p{color:#a9bdcf;line-height:1.6}
      #startup-error{display:none;max-width:760px;margin:20px auto 0;padding:16px;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;background:#251b22;border:1px solid #87515b;border-radius:10px;color:#ffd9df}
    </style>
  </head>
  <body>
    <div id="root">
      <main id="startup-status">
        <div>
          <h1>YJH's Iceland Volcano Simulator</h1>
          <p id="startup-message">시뮬레이터를 불러오는 중입니다…</p>
          <pre id="startup-error"></pre>
        </div>
      </main>
    </div>
    <script>
      (function () {
        var message = document.getElementById('startup-message');
        var errorBox = document.getElementById('startup-error');
        function showError(title, detail) {
          if (message) message.textContent = title;
          if (errorBox) {
            errorBox.style.display = 'block';
            errorBox.textContent = detail || '자세한 오류 내용이 브라우저에 전달되지 않았습니다.';
          }
        }
        window.addEventListener('error', function (event) {
          var detail = event.message || (event.target && (event.target.src || event.target.href)) || '스크립트 로드 오류';
          showError('시뮬레이터 시작 중 오류가 발생했습니다.', String(detail) + (event.filename ? '\\n' + event.filename + ':' + event.lineno : ''));
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          showError('초기화 중 처리되지 않은 오류가 발생했습니다.', reason && (reason.stack || reason.message) ? (reason.stack || reason.message) : String(reason));
        });
        window.setTimeout(function () {
          if (document.getElementById('startup-status')) {
            showError('앱 코드가 실행되지 않았습니다.', '페이지 HTML은 열렸지만 React 앱이 시작되지 않았습니다. 주소 경로, JavaScript 파일 요청 상태 또는 브라우저 확장 프로그램의 차단 여부를 확인해야 합니다.');
          }
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
