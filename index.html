<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111d" />
    <title>YJH's Iceland Volcano Simulator</title>
    <style>
      html,body{margin:0;min-height:100%;background:#07111d;color:#e8f0f7;font-family:system-ui,sans-serif}
      #root{min-height:100vh}
      .boot-status{box-sizing:border-box;min-height:100vh;display:grid;place-content:center;padding:28px;text-align:center}
      .boot-status h1{font-size:22px;margin:0 0 12px}
      .boot-status p{color:#a8bac9;line-height:1.6;max-width:650px}
      .boot-error{margin:16px auto 0;padding:14px;max-width:760px;white-space:pre-wrap;overflow-wrap:anywhere;text-align:left;background:#351f25;border:1px solid #a95050;border-radius:8px;color:#ffd6d0}
    </style>
  </head>
  <body>
    <div id="root"><main class="boot-status"><h1>YJH's Iceland Volcano Simulator</h1><p>앱을 불러오는 중입니다. 잠시만 기다려 주세요.</p></main></div>
    <script>
      (function () {
        function showBootError(title, detail) {
          var root = document.getElementById('root');
          if (!root || root.querySelector('[data-boot-error]')) return;
          var main = document.createElement('main');
          main.className = 'boot-status';
          main.setAttribute('data-boot-error', 'true');
          var h = document.createElement('h1');
          h.textContent = title;
          var p = document.createElement('p');
          p.textContent = '페이지는 열렸지만 앱 코드가 정상적으로 시작되지 않았습니다. 아래 오류 내용을 확인해 주세요.';
          var pre = document.createElement('pre');
          pre.className = 'boot-error';
          pre.textContent = detail || '오류 상세 정보가 브라우저에서 제공되지 않았습니다.';
          main.append(h, p, pre);
          root.replaceChildren(main);
        }
        window.addEventListener('error', function (event) {
          showBootError('앱 스크립트 로드 또는 실행 오류', event.message || (event.target && event.target.src) || 'script load error');
        });
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          showBootError('초기화 중 처리되지 않은 오류', reason && (reason.stack || reason.message) || String(reason));
        });
        window.setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.querySelector('.boot-status') && !root.querySelector('[data-boot-error]')) {
            showBootError('앱이 시작되지 않았습니다', '12초가 지났지만 React 앱이 화면을 그리지 못했습니다. 배포된 index.html과 JavaScript 번들 경로를 확인해야 합니다.');
          }
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
